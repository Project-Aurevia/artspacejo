    <script>
      // Apply the stored theme + language before first paint so there is no flash of the wrong palette.
      // Mirrors the one-time migration in store.jsx: pre-v2 state defaults to the light editorial palette.
      try {
        var saved = JSON.parse(localStorage.getItem('artspace_jo_v1') || '{}');
        var staleTheme = (saved.themeV || 1) < 2;
        document.documentElement.classList.toggle('dark', staleTheme ? false : saved.dark === true);
        var lang = saved.lang === 'en' ? 'en' : 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) { /* first visit or storage blocked — defaults already on <html> */ }
    </script>
  </head>
  <body>
    <noscript>Art Space | مساحة الفن — Signage, printing, social media & marketing in Amman, Jordan. Please enable JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
